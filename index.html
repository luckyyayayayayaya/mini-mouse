<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鼠鼠粮仓 · 闯关扫雷</title>
<style>
:root{--cream:#fff8e9;--wood:#8b572f;--deep:#472818;--cell:min(8vw,44px)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:linear-gradient(145deg,#f9e3b2,#d28a4f 48%,#82462d);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--deep)}.app{width:min(100%,920px);margin:auto;background:#fff8e9ef;border:4px solid #6f3b21;border-radius:26px;padding:22px;box-shadow:0 20px 45px #43200b55}header{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:15px}h1{margin:0;font-size:clamp(35px,7vw,62px);letter-spacing:-3px;color:#74371f}.subtitle{margin:5px 0 0;color:#98623b;font-weight:700}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:81px;padding:7px 9px;background:#6c3b25;color:#fff5df;border-radius:11px;text-align:center;font-size:10px;font-weight:800}.stat strong{display:block;font-size:20px;color:#ffd36c}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar select,.toolbar button{border:2px solid #b77b42;border-radius:10px;padding:10px 12px;font:inherit;font-weight:800}.toolbar select{flex:1;min-width:190px;background:#fffdf5;color:var(--deep)}button{cursor:pointer}.toolbar button{background:#d47f32;color:#fff8e9}.toolbar button.secondary{background:#fff5da;color:#82462d}.board-wrap{position:relative;display:flex;justify-content:center;overflow:auto;padding:13px;border-radius:17px;background:repeating-linear-gradient(0deg,#b8753d,#b8753d 9px,#c4864e 10px,#c4864e 18px);box-shadow:inset 0 0 0 3px #75401f,0 10px 20px #54281044}.board{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));gap:3px}.cell{width:var(--cell);height:var(--cell);padding:0;border:0;border-radius:6px;background:#d6a058;box-shadow:inset 2px 2px #f0c986,inset -2px -2px #a66b34;font-size:clamp(16px,3.8vw,24px);font-weight:900;color:#fff;cursor:pointer}.cell:hover{filter:brightness(1.09)}.cell.open{background:#f4d788;box-shadow:none;color:#7b461f;cursor:default}.cell.open.n1{color:#2878ad}.cell.open.n2{color:#398047}.cell.open.n3{color:#c05a2f}.cell.open.n4{color:#7d4c9a}.cell.cat{background:#e26e48;animation:shake .35s}.cell.flag{background:#c68e46}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#fff8e9df;opacity:0;pointer-events:none;transition:.2s;z-index:3}.overlay.show{opacity:1;pointer-events:auto}.modal{width:min(100%,470px);padding:24px;border:3px solid #9a5b2e;border-radius:19px;background:#fffaf0;text-align:center;box-shadow:0 15px 35px #51200b33}.modal h2{margin:0 0 8px;font-size:30px}.modal p{margin:6px 0 16px;color:#855b3b}.modal button{border:0;border-radius:9px;padding:11px 15px;background:#ce7830;color:#fff;font:inherit;font-weight:800}.escape-map{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(100%,400px);margin:15px auto 10px;padding:8px;border-radius:12px;background:#d7b27a}.escape-cell{aspect-ratio:1;border-radius:5px;background:#efd8a9;display:grid;place-items:center;font-size:20px}.escape-cell.wall{background:#8f5e39}.escape-cell.goal{background:#7ccf8a}.tip{margin:13px 0 0;text-align:center;color:#98623b;font-size:13px;font-weight:700}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@media(max-width:530px){:root{--cell:8.5vw}header{align-items:center;flex-direction:column;text-align:center}.stats{justify-content:center}.app{padding:15px}}
</style></head><body><main class="app"><header><div><h1>🐭 鼠鼠粮仓</h1><p class="subtitle">翻开稻谷，躲开小猫，闯过所有粮仓关卡！</p></div><div class="stats"><div class="stat">关卡<strong id="levelNo">1</strong></div><div class="stat">剩余稻谷<strong id="safeLeft">0</strong></div><div class="stat">小猫<strong id="catCount">10</strong></div><div class="stat">时间<strong id="time">0</strong></div><div class="stat">逃生机会<strong id="escapeCount">1</strong></div></div></header><div class="toolbar"><select id="mode"><option value="escape">🐭 老鼠逃生模式（推荐）</option><option value="classic">🎯 经典闯关扫雷</option></select><button id="newGame">新游戏</button><button id="resetLevel" class="secondary">重置本关</button><button id="nextLevel" class="secondary" disabled>下一关</button></div><div class="board-wrap"><div id="board" class="board"></div><div id="overlay" class="overlay"></div></div><p class="tip">左键翻开稻谷 · 右键插旗 · 手机长按插旗　|　首次点击保证安全</p></main>
<style>.caught{font-size:58px;letter-spacing:-14px;margin:2px 0 8px;animation:hug .9s ease-in-out infinite}.caught span{display:inline-block}.caught span:first-child{animation:bounce .7s ease-in-out infinite alternate}@keyframes hug{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}@keyframes bounce{to{transform:translateY(-7px) rotate(8deg)}}</style><script>new MutationObserver(()=>{const o=document.querySelector('#overlay');if(o&&o.classList.contains('show')&&o.textContent.includes('被小猫抓住')&&!o.querySelector('.caught')){const d=document.createElement('div');d.className='caught';d.innerHTML='<span>🐱</span><span>🐭</span>';o.querySelector('.modal').prepend(d)}}).observe(document.body,{subtree:true,childList:true});</script><script>
(()=>{const levels=[{r:9,c:9,m:10},{r:11,c:11,m:11},{r:12,c:12,m:13},{r:13,c:13,m:15},{r:14,c:14,m:18},{r:15,c:15,m:22},{r:16,c:16,m:28}];const $=s=>document.querySelector(s),board=$('#board'),overlay=$('#overlay'),mode=$('#mode');let lv=0,rows,cols,mines,cells=[],started,over,flags,escapeReady,timer=0,clock,press;
function setup(){clearInterval(clock);({r:rows,c:cols,m:mines}=levels[Math.min(lv,levels.length-1)]);cells=Array.from({length:rows*cols},(_,i)=>({i,mine:false,open:false,flag:false,n:0}));started=false;over=false;flags=0;escapeReady=mode.value==='escape';timer=0;$('#time').textContent=0;$('#levelNo').textContent=lv+1;$('#catCount').textContent=mines;$('#nextLevel').disabled=true;overlay.classList.remove('show');board.style.setProperty('--cols',cols);board.innerHTML='';cells.forEach(c=>{let b=document.createElement('button');b.className='cell';b.addEventListener('click',()=>reveal(c.i));b.addEventListener('contextmenu',e=>{e.preventDefault();flag(c.i)});b.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')press=setTimeout(()=>flag(c.i),520)});['pointerup','pointerleave'].forEach(x=>b.addEventListener(x,()=>clearTimeout(press)));board.append(b)});render();stats()}
function around(i){let r=Math.floor(i/cols),c=i%cols,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if((dr||dc)&&rr>=0&&rr<rows&&cc>=0&&cc<cols)a.push(rr*cols+cc)}return a}
function plant(safe){let pool=cells.filter(c=>c.i!==safe&&!around(safe).includes(c.i));for(let n=0;n<mines;n++){let p=Math.floor(Math.random()*pool.length);pool[p].mine=true;pool.splice(p,1)}cells.forEach(c=>c.n=around(c.i).filter(i=>cells[i].mine).length)}function begin(i){started=true;plant(i);clock=setInterval(()=>$('#time').textContent=++timer,1000)}
function reveal(i){let c=cells[i];if(over||c.open||c.flag)return;if(!started)begin(i);if(c.mine){if(mode.value==='escape'&&escapeReady){c.open=true;render();showEscape(i)}else fail('被小猫抓住啦！');return}flood(i);render();if(cells.every(x=>x.mine||x.open))win()}function flood(i){let c=cells[i];if(c.open||c.flag)return;c.open=true;if(!c.n)around(i).forEach(flood)}function flag(i){let c=cells[i];if(over||c.open)return;if(!started)begin(i);c.flag=!c.flag;flags+=c.flag?1:-1;render();stats()}
function render(){cells.forEach(c=>{let b=board.children[c.i];b.className='cell';b.textContent='';if(c.open){b.classList.add('open');if(c.mine){b.classList.add('cat');b.textContent='🐱'}else if(c.n){b.classList.add('n'+c.n);b.textContent=c.n}}else if(c.flag){b.classList.add('flag');b.textContent='🚩'}})}function stats(){$('#safeLeft').textContent=cells.filter(c=>!c.mine&&!c.open).length;$('#escapeCount').textContent=escapeReady?'1':'0'}
function win(){over=true;clearInterval(clock);cells.forEach(c=>{if(c.mine)c.flag=true});render();$('#nextLevel').disabled=false;show('<h2>🎉 粮仓闯关成功！</h2><p>第 '+(lv+1)+' 关的稻谷都翻完啦。</p><button id="goNext">进入下一关</button>');$('#goNext').onclick=()=>{lv++;setup()}}function fail(text){over=true;clearInterval(clock);cells.forEach(c=>{if(c.mine)c.open=true});render();show('<h2>🐱 '+text+'</h2><p>小鼠需要再谨慎一点！</p><button id="retry">重新挑战</button>');$('#retry').onclick=setup}function show(html){overlay.innerHTML='<div class="modal">'+html+'</div>';overlay.classList.add('show')}
function showEscape(hit){escapeReady=false;let map=['########',' #     #',' # ### #',' #     #',' ### # #',' #   #G#',' #M    #','########'].map(x=>x.padEnd(8,'#').slice(0,8).split(''));let pos=[6,2],goal=[5,6],bad=[[1,1],[3,3],[4,5]];function draw(){overlay.querySelector('.escape-map').innerHTML='';map.forEach((row,r)=>row.forEach((v,c)=>{let d=document.createElement('div');d.className='escape-cell '+(v==='#'?'wall':v==='G'?'goal':'');if(r===pos[0]&&c===pos[1])d.textContent='🐭';else if(bad.some(x=>x[0]===r&&x[1]===c))d.textContent='🐱';overlay.querySelector('.escape-map').append(d)}))}show('<h2>🏃 小鼠逃生！</h2><p>用方向键移动到绿色安全粮仓，限时15秒！</p><div class="escape-map"></div><strong id="escapeTime">15</strong> 秒');let left=15;draw();let tick=setInterval(()=>{left--;$('#escapeTime').textContent=left;if(left<=0){clearInterval(tick);document.removeEventListener('keydown',key);fail('逃生失败，被小猫抓到啦！')}},1000);function key(e){let d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(!d)return;e.preventDefault();let nr=pos[0]+d[0],nc=pos[1]+d[1];if(map[nr]?.[nc]==='#')return;pos=[nr,nc];if(bad.some(x=>x[0]===nr&&x[1]===nc)){clearInterval(tick);document.removeEventListener('keydown',key);fail('逃生失败，被小猫抓到啦！');return}draw();if(nr===goal[0]&&nc===goal[1]){clearInterval(tick);document.removeEventListener('keydown',key);overlay.classList.remove('show');cells[hit].mine=true;cells[hit].open=true;render();stats()}}document.addEventListener('keydown',key)}
$('#newGame').onclick=()=>{lv=0;setup()};$('#resetLevel').onclick=setup;$('#nextLevel').onclick=()=>{if(!$('#nextLevel').disabled){lv++;setup()}};mode.onchange=setup;setup()})();
</script></body></html>
